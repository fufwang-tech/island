<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #F8F6F1;
            --text-color: #4A4A48;
            --accent-green: #8B9A7D;
            --accent-pink: #D4B5A8;
            --accent-pink-light: #E8D5CC;
            --border-color: #C5C5C0;
        }

        body {
            font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
        }

        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -5%;
            width: 300px;
            height: 300px;
            background: radial-gradient(ellipse at center, var(--accent-green) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
        }

        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 250px;
            height: 250px;
            background: radial-gradient(ellipse at center, var(--accent-pink) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
        }

        .plant-line {
            position: absolute;
            stroke: var(--accent-green);
            stroke-width: 1;
            fill: none;
            opacity: 0.3;
        }

        /* 容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 开始页 */
        .start-page {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .start-page h1 {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .start-page .subtitle {
            font-size: 0.95rem;
            color: var(--accent-green);
            letter-spacing: 0.1em;
            margin-bottom: 60px;
            font-weight: 300;
        }

        .start-page .divider {
            width: 60px;
            height: 1px;
            background: var(--border-color);
            margin: 0 auto 60px;
        }

        .start-btn {
            display: inline-block;
            padding: 16px 48px;
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .start-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* 题目页 */
        .quiz-page {
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .progress {
            font-size: 0.85rem;
            color: var(--accent-green);
            letter-spacing: 0.15em;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 2;
            color: var(--text-color);
            font-weight: 400;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;

            /* 核心修复：开启 Flex 布局 */
            display: flex;
            align-items: flex-start; 
            gap: 12px;
        }

        .option:hover {
            border-color: var(--accent-green);
            background: rgba(139, 154, 125, 0.08);
        }

        .option-label {
           flex-shrink: 0; /* 防止序号被挤压成椭圆 */
            width: 28px;
            height: 28px;
            line-height: 26px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            font-size: 0.85rem;
            color: var(--accent-green);
            font-family: 'Cormorant Garamond', serif;
        }

        .option:hover .option-label {
            border-color: var(--accent-green);
            background: var(--accent-green);
            color: white;
        }

        .option-text {
           flex: 1; /* 让文字占据剩余空间，自动换行且对齐 */
           font-size: 0.95rem;
           color: var(--text-color);
           line-height: 1.6;
           word-break: break-word;
           padding-top: 2px; /* 让文字中心与序号圆圈对齐 */
        }

        /* 结果页 */
        .result-page {
            display: none;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .result-label {
            font-size: 0.85rem;
            color: var(--accent-green);
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }

        .result-emoji {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .result-name {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        .result-lyric {
            font-size: 1rem;
            color: var(--accent-green);
            font-style: italic;
            margin-bottom: 30px;
            padding: 0 20px;
            line-height: 1.9;
        }

        .result-desc {
            font-size: 0.95rem;
            color: var(--text-color);
            margin-bottom: 50px;
            padding: 0 20px;
            line-height: 2;
        }

        .result-divider {
            width: 40px;
            height: 1px;
            background: var(--accent-pink);
            margin: 0 auto 50px;
        }

        /* 结果页面底部提示文字 */
        .result-note {
            font-size: 0.6rem;
            color: var(--accent-green);
            opacity: 0.7;
            text-align: center;
            margin-top: 30px;
            letter-spacing: 0.05em;
            line-height: 1.5;
            padding: 0 20px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .result-note {
                font-size: 0.75rem;
                margin-top: 25px;
                padding: 0 15px;
            }
        }

        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .share-btn, .restart-btn {
            padding: 14px 40px;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .share-btn {
            background: var(--accent-green);
            border: 1px solid var(--accent-green);
            color: white;
        }

        .share-btn:hover {
            background: transparent;
            color: var(--accent-green);
        }

        .restart-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .restart-btn:hover {
            border-color: var(--text-color);
        }

        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .aplayer {
            width: 100% !important;
            max-width: 320px;
        }

        .aplayer * {
            box-sizing: border-box;
        }

        /* MetingJS播放器样式优化 */
        .spotify-player meting-js {
            display: block;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* 自定义APlayer主题色以匹配网站 */
        .aplayer {
            --aplayer-theme: #8B9A7D; /* 主色调使用您的accent-green */
            --aplayer-lrc-color: #4A4A48; /* 歌词颜色 */
            --aplayer-list-hover: rgba(139, 154, 125, 0.1); /* 列表悬停背景 */
            --aplayer-list-bg: #F8F6F1; /* 列表背景 */
            font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
        }

        /* 播放器控制栏 */
        .aplayer .aplayer-body .aplayer-info .aplayer-music .aplayer-title {
            color: #4A4A48;
            font-weight: 500;
        }

        .aplayer .aplayer-body .aplayer-info .aplayer-music .aplayer-author {
            color: #8B9A7D;
        }

        /* 进度条 */
        .aplayer .aplayer-body .aplayer-info .aplayer-cont .aplayer-bar-wrap .aplayer-bar {
            background: rgba(139, 154, 125, 0.2);
        }

        .aplayer .aplayer-body .aplayer-info .aplayer-cont .aplayer-bar-wrap .aplayer-bar .aplayer-played {
            background: #8B9A7D;
        }

        .aplayer .aplayer-body .aplayer-info .aplayer-cont .aplayer-bar-wrap .aplayer-bar .aplayer-played .aplayer-thumb {
            background: #8B9A7D;
            box-shadow: 0 0 5px rgba(139, 154, 125, 0.5);
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .spotify-player meting-js {
                border-radius: 8px;
            }
            
            .aplayer {
                font-size: 13px;
            }
            
            .aplayer .aplayer-list ol li {
                padding: 8px 12px;
            }
        }

        /* Spotify播放器样式 */
        .spotify-section {
            margin: 30px 0;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .spotify-label {
            font-size: 0.85rem;
            color: var(--accent-green);
            letter-spacing: 0.1em;
            margin-bottom: 12px;
             display: flex;
             align-items: center;
             justify-content: center;
             gap: 8px;
        }

        .spotify-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background: #1DB954;
            color: white;
            text-decoration: none;
            border-radius: 24px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(29, 185, 84, 0.2);
        }

        .spotify-button:hover {
            background: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .spotify-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(29, 185, 84, 0.2);
        }

        /* Spotify内嵌播放器样式 */
        .spotify-player {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 213, 204, 0.3);
        }

        .spotify-player iframe {
            border-radius: 12px;
            border: none;
            width: 100%;
            height: 80px;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .spotify-player {
            width: 100%;
            max-width: 400px; /* 限制最大宽度，防止在大屏太散 */
            margin: 0 auto;
            overflow: hidden; /* 强制切除溢出部分 */
            }
            
            .spotify-section {
                width: 100%;
                margin: 30px 0;
                padding: 0 15px; /* 给左右留点呼吸感 */
                box-sizing: border-box;
            }
        }

        /* ========== 修复：移动端选项文本排版 (精准修复版) ========== */
        /* 策略：左对齐 + 禁止在汉字中断行，并确保文本块自然流动 */

        .option .option-text {
            /* 1. 改用左对齐，避免justify导致的标点问题 */
            text-align: left;
            /* 2. 保持中文词汇完整，不在汉字中间断开 */
            word-break: keep-all;
            /* 3. 允许过长的英文/数字连续字符在合适位置断开 */
            overflow-wrap: break-word;
            /* 4. 移除任何可能妨碍文本自然宽度的限制 */
            min-width: 0;
            /* 5. 确保行高，提升可读性 */
            line-height: 1.6;
            /* 6. 设置为行内块元素，确保与A. B. C. D.标签保持在同一文本流中 */
            display: inline;
        }

        /* 移动端专属微调 */
        @media (max-width: 768px) {
            .option .option-text {
                /* 可选：稍微收紧字距，使排版在窄屏下更紧凑 */
                letter-spacing: -0.01em;
            }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .aplayer {
                width: 100% !important;
                margin: 0 !important;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08) !important;
                border: none !important;
            }
            
            .container {
                padding: 30px 20px;
            }

            .start-page h1 {
                font-size: 1.8rem;
            }

            .question-text {
                font-size: 1.05rem;
            }

            .option {
                padding: 18px 20px;
            }

            .result-name {
                font-size: 1.7rem;
            }

            .result-lyric {
                font-size: 0.95rem;
            }

            
        }

        /* 隐藏canvas */
        #shareCanvas {
            display: none;
        }

                @media (max-width: 768px) {
            .spotify-player {
                max-width: 100%;
                margin: 0 10px;
            }
            
            .spotify-label {
                font-size: 0.8rem;
            }
            
            /* 确保MetingJS播放器在移动端正常显示 */
            .aplayer .aplayer-body {
                padding: 10px;
            }
            
            .aplayer .aplayer-list {
                max-height: 150px;
            }
        }

        /* ========== 电脑端 APlayer 播放器修复 ========== */
        @media (min-width: 769px) {
            /* 1. 强制重置所有APlayer按钮大小 */
            .aplayer .aplayer-icon {
                width: 24px !important;
                height: 24px !important;
                font-size: 18px !important;
            }
            
            /* 2. 播放按钮容器 */
            .aplayer .aplayer-play, 
            .aplayer .aplayer-pause {
                width: 32px !important;
                height: 32px !important;
                margin: 0 8px !important;
            }
            
            /* 3. SVG图标强制缩放 */
            .aplayer svg {
                width: 20px !important;
                height: 20px !important;
                transform: scale(0.7) !important;
            }
        }

        .spotify-player {
            display: flex;
            justify-content: center;
        }

        .aplayer {
            width: 100% !important;
            max-width: 320px;
        }
    </style>
</head>

                }
            }

            // 3. 第二轮筛选：比较“胜出场次”（独家出现次数）
            // 计算每位平局歌手在多少道题中是“独家选项”（该题所有选中歌手中只有她一人）
            const exclusiveWins = {};
            let maxExclusiveWins = -1;
            let finalCandidates = [];
            
            topSingers.forEach(singer => {
                let count = 0;
                for (let q = 0; q < questions.length; q++) {
                    const chosenSingers = selectedSingersPerQuestion[q];
                    // 如果该题只选中了这位歌手一人
                    if (chosenSingers.length === 1 && chosenSingers[0] === singer) {
                        count++;
                    }
                }
                exclusiveWins[singer] = count;
                if (count > maxExclusiveWins) {
                    maxExclusiveWins = count;
                    finalCandidates = [singer];
                } else if (count === maxExclusiveWins) {
                    finalCandidates.push(singer);
                }
            });
            if (finalCandidates.length === 1) {
                console.log(`根据独家胜出场次选出: ${finalCandidates[0]}`);
                return finalCandidates[0];
            }

            // 4. 终极平局：使用歌手顺序（原逻辑，但作为最后手段）
            console.log(`终极平局，按歌手顺序列表裁决`);
            for (let i = 0; i < singerOrder.length; i++) {
                if (finalCandidates.includes(singerOrder[i])) {
                    return singerOrder[i];
                }
            }
            // 保底返回
            return finalCandidates[0];
        }

        // 显示结果
        function showResult() {
            const resultSinger = calculateResultEnhanced();
            const singerInfo = singers[resultSinger];

            document.getElementById('quizPage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'block';

            document.getElementById('resultEmoji').textContent = singerInfo.emoji;
            document.getElementById('resultName').textContent = singerInfo.name;
            document.getElementById('resultLyric').textContent = singerInfo.lyric;
            
           // 显示网易云音乐播放器 (使用MetingJS)
            const spotifySection = document.getElementById('spotifySection');
            const spotifyPlayer = document.getElementById('spotifyPlayer');
            
            if (singerInfo.neteaseId) {
                // 清空之前的内容
                spotifyPlayer.innerHTML = '';
                
                // 创建MetingJS播放器元素
                const metingElement = document.createElement('meting-js');
                
                // 设置播放器属性
                metingElement.setAttribute('server', 'netease');
                metingElement.setAttribute('type', 'song');
                metingElement.setAttribute('id', singerInfo.neteaseId);
                metingElement.setAttribute('autoplay', 'false');
                metingElement.setAttribute('theme', '#8B9A7D'); 
                metingElement.setAttribute('mini', 'false'); 
                
                spotifyPlayer.appendChild(metingElement);
                spotifySection.style.display = 'block';
            }

        // 重新测试
        function restartQuiz() {
            initScores();
            currentQuestion = 0;
            document.getElementById('resultPage').style.display = 'none';
            document.getElementById('startPage').style.display = 'block';
        }

            // 背景色
            ctx.fillStyle = '#F8F6F1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 装饰圆形
            ctx.fillStyle = 'rgba(139, 154, 125, 0.1)';
            ctx.beginPath();
            ctx.arc(500, 100, 120, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(212, 181, 168, 0.1)';
            ctx.beginPath();
            ctx.arc(80, 700, 100, 0, Math.PI * 2);
            ctx.fill();

            // 标题
            ctx.fillStyle = '#4A4A48';
            ctx.font = '300 20px "Noto Serif SC", serif';
            ctx.textAlign = 'center';
            ctx.fillText('测测你是哪个台湾女歌手', canvas.width / 2, 80);

            // 分隔线
            ctx.strokeStyle = '#C5C5C0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(220, 110);
            ctx.lineTo(380, 110);
            ctx.stroke();

            // Emoji
            ctx.font = '80px serif';
            ctx.fillText(resultEmoji, canvas.width / 2, 220);

            // 歌手名字
            ctx.fillStyle = '#4A4A48';
            ctx.font = '500 42px "Noto Serif SC", "Cormorant Garamond", serif';
            ctx.fillText(resultName, canvas.width / 2, 320);

            // 歌词
            ctx.fillStyle = '#8B9A7D';
            ctx.font = 'italic 22px "Noto Serif SC", serif';
            ctx.fillText('"' + resultLyric + '"', canvas.width / 2, 400);

            // 分隔线2
            ctx.strokeStyle = '#D4B5A8';
            ctx.beginPath();
            ctx.moveTo(270, 440);
            ctx.lineTo(330, 440);
            ctx.stroke();

            // 描述
            ctx.fillStyle = '#4A4A48';
            ctx.font = '20px "Noto Serif SC", serif';
            ctx.fillText(resultDesc, canvas.width / 2, 500);

            // 底部文字
            ctx.fillStyle = '#8B9A7D';
            ctx.font = '14px "Noto Serif SC", serif';
            ctx.fillText('扫码测试，发现你的台女文艺人格', canvas.width / 2, 720);

            // 下载图片
            const link = document.createElement('a');
            link.download = '我是' + resultName + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
